<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-label="Virto Commerce — Release Notes, November 2026. Stable 16, Admin Shell, passkeys, agent checkout.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07254A"/>
      <stop offset="1" stop-color="#0B2F5E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B7FFF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.55">
      <stop offset="0" stop-color="rgba(43,127,255,0.55)"/>
      <stop offset="1" stop-color="rgba(7,37,74,0)"/>
    </radialGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#grid)"/>
  <rect width="1200" height="627" fill="url(#glow)"/>

  <!-- Soft accent orb (hero visual area) -->
  <circle cx="990" cy="260" r="150" fill="#2B7FFF" opacity="0.18" filter="url(#soft)"/>
  <circle cx="990" cy="260" r="90" fill="#38BDF8" opacity="0.22" filter="url(#soft)"/>

  <!-- Brand row -->
  <g transform="translate(72,70)">
    <!-- Logo tile -->
    <rect width="48" height="48" rx="12" fill="#FFFFFF"/>
    <g transform="translate(9,9)">
      <path d="M0 0 L15 30 L30 0 L22.5 0 L15 15 L7.5 0 Z" fill="#2B7FFF"/>
    </g>
    <text x="68" y="20" font-family="Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">Virto Commerce</text>
    <text x="68" y="42" font-family="Inter, 'Segoe UI', sans-serif" font-weight="600" font-size="12" letter-spacing="3" fill="#38BDF8">ENTERPRISE COMMERCE PLATFORM</text>
  </g>

  <!-- Release pill (top right) -->
  <g transform="translate(878,78)">
    <rect width="250" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
    <circle cx="20" cy="18" r="4" fill="#FBBF24"/>
    <text x="34" y="23" font-family="Inter, 'Segoe UI', sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#FFFFFF">RELEASE NOTES · NOV 2026</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(72,200)">
    <text font-family="Inter, 'Segoe UI', sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#38BDF8">WHAT SHIPPED THIS MONTH</text>
    <text y="56" font-family="Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="72" fill="#FFFFFF" letter-spacing="-2">Release Notes</text>
    <text y="128" font-family="Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="72" fill="url(#accent)" letter-spacing="-2">November 2026</text>
  </g>

  <!-- Subtitle (factual list) -->
  <g transform="translate(72,406)">
    <text font-family="Inter, 'Segoe UI', sans-serif" font-weight="500" font-size="22" fill="rgba(255,255,255,0.85)" letter-spacing="-0.3">Stable 16 · Admin Shell · Frontend Next · OTP, passkeys, MFA ·</text>
    <text y="30" font-family="Inter, 'Segoe UI', sans-serif" font-weight="500" font-size="22" fill="rgba(255,255,255,0.85)" letter-spacing="-0.3">Returns in-app · UCP agent checkout · Sales Rep Hub (Module Federation)</text>
  </g>

  <!-- Chip row -->
  <g transform="translate(72,490)" font-family="Inter, 'Segoe UI', sans-serif" font-size="13">
    <!-- 7 WOW -->
    <g>
      <rect width="162" height="38" rx="19" fill="url(#goldA)"/>
      <text x="22" y="24" font-weight="800" fill="#07254A">★</text>
      <text x="40" y="24" font-weight="700" fill="#07254A">7 WOW features</text>
    </g>
    <!-- S16 -->
    <g transform="translate(176,0)">
      <rect width="216" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="10" y="7" width="40" height="24" rx="12" fill="rgba(56,189,248,0.18)"/>
      <text x="30" y="24" font-weight="700" font-size="12" fill="#38BDF8" text-anchor="middle">S16</text>
      <text x="60" y="24" font-weight="600" fill="#FFFFFF">Agent-upgrade bundle</text>
    </g>
    <!-- 3 sign-in -->
    <g transform="translate(406,0)">
      <rect width="186" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="10" y="7" width="26" height="24" rx="12" fill="rgba(251,191,36,0.2)"/>
      <text x="23" y="24" font-weight="700" font-size="12" fill="#FBBF24" text-anchor="middle">3</text>
      <text x="46" y="24" font-weight="600" fill="#FFFFFF">New sign-in paths</text>
    </g>
    <!-- MF plugin -->
    <g transform="translate(606,0)">
      <rect width="266" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
      <rect x="10" y="7" width="40" height="24" rx="12" fill="rgba(43,127,255,0.22)"/>
      <text x="30" y="24" font-weight="700" font-size="12" fill="#2B7FFF" text-anchor="middle">MF</text>
      <text x="60" y="24" font-weight="600" fill="#FFFFFF">First Module Federation plugin</text>
    </g>
  </g>

  <!-- URL bar -->
  <g transform="translate(72,575)">
    <text font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="15" fill="rgba(255,255,255,0.6)">virtocommerce.github.io/vc-release-notes/2026-11/</text>
  </g>

  <!-- Right-side mini-card visual (preview of a slide) -->
  <g transform="translate(830,180)">
    <rect width="300" height="200" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
    <!-- WOW tag -->
    <rect x="18" y="18" width="88" height="24" rx="12" fill="url(#goldA)"/>
    <text x="30" y="34" font-family="Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#07254A">★ WOW</text>
    <!-- Title -->
    <text x="18" y="76" font-family="Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">Stable 16</text>
    <text x="18" y="100" font-family="Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">release bundle</text>
    <text x="18" y="128" font-family="Inter, 'Segoe UI', sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#38BDF8">PLATFORM · STABLE 16</text>
    <!-- Mini P/S/I bars -->
    <g transform="translate(18,148)">
      <rect y="0" width="3" height="10" fill="#F97316"/>
      <rect x="10" y="2" width="90" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
      <rect y="18" width="3" height="10" fill="#2B7FFF"/>
      <rect x="10" y="20" width="120" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
      <rect y="36" width="3" height="10" fill="#07254A" stroke="#FFFFFF"/>
      <rect x="10" y="38" width="100" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
    </g>
    <!-- Size badge -->
    <g transform="translate(258,18)">
      <rect width="24" height="24" rx="6" fill="#FFFFFF"/>
      <rect x="2" y="2" width="20" height="20" rx="4" fill="#FBBF24"/>
      <text x="12" y="17" font-family="Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="12" text-anchor="middle" fill="#07254A">M</text>
    </g>
  </g>

  <!-- Bottom-right marker -->
  <g transform="translate(1020,575)">
    <text font-family="Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="13" letter-spacing="2" fill="rgba(255,255,255,0.4)" text-anchor="end">34 SLIDES · INTERACTIVE</text>
  </g>
</svg>
