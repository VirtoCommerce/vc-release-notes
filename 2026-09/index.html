<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Virto Commerce – Release Notes | September 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --virto-navy: #07254A;
    --virto-navy-2: #0B3270;
    --virto-blue: #2B7FFF;
    --virto-blue-2: #1A6CFF;
    --virto-cyan: #38BDF8;
    --virto-accent: #FF6A3D;
    --virto-gold: #FBBF24;
    --virto-bg: #F4F7FB;
    --virto-bg-2: #EAF1FA;
    --virto-white: #FFFFFF;
    --virto-text: #0F172A;
    --virto-muted: #5B6B82;
    --virto-line: #DCE5F1;

    --size-s:  #22C55E;   /* green — drop-in / light config */
    --size-m:  #FBBF24;   /* amber — setup + dev */
    --size-l:  #F97316;   /* orange — integration / migration */

    --shadow-soft: 0 10px 40px -12px rgba(7, 37, 74, 0.18);
    --shadow-deep: 0 30px 80px -30px rgba(7, 37, 74, 0.35);

    --radius: 16px;
    --radius-lg: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--virto-bg);
    color: var(--virto-text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .slide {
    position: absolute;
    width: min(1200px, calc(100vw - 48px));
    height: min(720px, calc(100vh - 48px));
    background: var(--virto-white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-deep);
    overflow: hidden;
    opacity: 0;
    transform: translateX(40px) scale(0.98);
    transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0s linear 0.45s;
    pointer-events: none;
    visibility: hidden;
  }

  .slide.active {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
    visibility: visible;
    transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0s linear 0s;
  }

  .slide-inner {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 36px 50px 24px;
  }

  .slide-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--virto-line);
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--virto-blue), var(--virto-navy));
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 800; font-size: 18px;
    letter-spacing: -0.5px;
    box-shadow: 0 4px 12px rgba(43, 127, 255, 0.4);
    overflow: hidden;
  }
  .brand-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
  .brand-text .b1 { font-weight: 700; font-size: 14px; color: var(--virto-navy); letter-spacing: -0.2px; }
  .brand-text .b2 { font-size: 11px; color: var(--virto-muted); text-transform: uppercase; letter-spacing: 1.2px; }
  .header-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--virto-muted);
    text-transform: uppercase; letter-spacing: 1.4px;
    flex-wrap: wrap; justify-content: flex-end;
  }
  .header-meta .pill {
    background: var(--virto-bg-2); color: var(--virto-navy);
    padding: 6px 12px; border-radius: 999px;
    font-weight: 600; letter-spacing: 0.8px;
  }

  .ts-badge {
    display: inline-flex; align-items: center;
    padding: 3px;
    border-radius: 8px;
    background: white;
    border: 1px solid var(--virto-line);
  }
  .ts-badge .ts-pill {
    width: 28px; height: 22px;
    border-radius: 6px;
    background: var(--ts-color, var(--virto-muted));
    color: white;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 11px;
    display: inline-flex; align-items: center; justify-content: center;
    letter-spacing: 0;
  }
  .ts-badge[data-size="S"]  { --ts-color: var(--size-s);  }
  .ts-badge[data-size="M"]  { --ts-color: var(--size-m);  }
  .ts-badge[data-size="L"]  { --ts-color: var(--size-l);  }

  /* Backlog add button */
  .backlog-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: white;
    border: 1px solid var(--virto-line);
    color: var(--virto-muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .backlog-btn:hover {
    border-color: var(--virto-blue);
    color: var(--virto-blue);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px -4px rgba(43, 127, 255, 0.4);
  }
  .backlog-btn.added {
    background: var(--virto-blue);
    color: white;
    border-color: var(--virto-blue);
  }
  .backlog-btn.added:hover {
    background: var(--virto-accent);
    border-color: var(--virto-accent);
    color: white;
  }
  .backlog-btn .plus { font-size: 14px; line-height: 1; }
  .backlog-btn .check { display: none; }
  .backlog-btn.added .plus { display: none; }
  .backlog-btn.added .check { display: inline; }
  .backlog-btn.added .label-add { display: none; }
  .backlog-btn.added .label-remove { display: inline; }
  .backlog-btn .label-remove { display: none; }

  /* Backlog counter in main nav */
  .backlog-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--virto-blue);
    color: white;
    border: none;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    margin-left: 4px;
  }
  .backlog-link:disabled {
    background: var(--virto-line);
    color: var(--virto-muted);
    cursor: not-allowed;
  }
  .backlog-link:not(:disabled):hover {
    background: var(--virto-accent);
    transform: translateY(-1px);
  }
  .backlog-link .count {
    background: rgba(255,255,255,0.25);
    padding: 1px 7px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10px;
  }
  .backlog-link:disabled .count {
    background: rgba(7, 37, 74, 0.1);
  }

  /* BACKLOG screen */
  .backlog-screen {
    background:
      radial-gradient(ellipse at top right, rgba(43, 127, 255, 0.1), transparent 60%),
      linear-gradient(135deg, var(--virto-bg) 0%, var(--virto-bg-2) 100%);
  }
  .backlog-screen .slide-inner {
    padding: 36px 50px 24px;
    grid-template-rows: auto 1fr auto;
  }
  .backlog-body {
    display: flex; flex-direction: column;
    gap: 18px;
    overflow: hidden;
    padding: 18px 0;
  }
  .backlog-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
  }
  .backlog-title-block { flex: 1; min-width: 280px; }
  .backlog-eyebrow {
    color: var(--virto-blue);
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .backlog-eyebrow::before {
    content: ""; width: 22px; height: 1.5px; background: var(--virto-blue);
  }
  .backlog-screen h1 {
    font-size: clamp(28px, 3.5vw, 40px);
    font-weight: 800;
    line-height: 1.05;
    color: var(--virto-navy);
    letter-spacing: -1.2px;
    margin: 8px 0 6px;
  }
  .backlog-screen h1 .grad {
    background: linear-gradient(90deg, var(--virto-blue), var(--virto-cyan));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .backlog-sub {
    font-size: 14px;
    color: var(--virto-muted);
    line-height: 1.5;
    max-width: 560px;
  }
  .backlog-actions {
    display: flex; gap: 10px; flex-wrap: wrap;
    align-items: center;
  }
  .bl-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--virto-line);
    background: white;
    color: var(--virto-navy);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .bl-btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-soft);
    border-color: var(--virto-blue);
  }
  .bl-btn.primary {
    background: var(--virto-blue);
    color: white;
    border-color: var(--virto-blue);
  }
  .bl-btn.primary:hover {
    background: var(--virto-blue-2);
    border-color: var(--virto-blue-2);
  }
  .bl-btn.primary.copied {
    background: var(--size-s);
    border-color: var(--size-s);
  }
  .bl-btn.danger:hover {
    border-color: var(--virto-accent);
    color: var(--virto-accent);
  }

  .backlog-list {
    flex: 1;
    overflow-y: auto;
    background: white;
    border: 1px solid var(--virto-line);
    border-radius: var(--radius);
    padding: 0;
    box-shadow: 0 6px 20px -10px rgba(7, 37, 74, 0.12);
  }
  .backlog-list::-webkit-scrollbar { width: 8px; }
  .backlog-list::-webkit-scrollbar-thumb {
    background: var(--virto-line);
    border-radius: 4px;
  }
  .backlog-empty {
    padding: 60px 40px;
    text-align: center;
    color: var(--virto-muted);
  }
  .backlog-empty .icon {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--virto-bg-2);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--virto-blue);
    margin-bottom: 14px;
  }
  .backlog-empty h3 {
    color: var(--virto-navy);
    font-size: 17px;
    margin-bottom: 6px;
  }
  .backlog-empty p { font-size: 13px; line-height: 1.5; }
  .backlog-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--virto-line);
    transition: background 0.15s;
  }
  .backlog-item:last-child { border-bottom: none; }
  .backlog-item:hover { background: var(--virto-bg); }
  .backlog-item-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--virto-muted);
    width: 28px;
    flex-shrink: 0;
    text-align: right;
  }
  .backlog-item-title {
    flex: 1;
    font-size: 14px;
    color: var(--virto-navy);
    font-weight: 500;
    line-height: 1.4;
    min-width: 0;
  }
  .backlog-item-cat {
    font-size: 10px;
    color: var(--virto-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
    font-weight: 600;
  }
  .backlog-item-size {
    flex-shrink: 0;
  }
  .backlog-item-size .ts-pill {
    width: 28px; height: 22px;
    border-radius: 6px;
    color: white;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .backlog-item-remove {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--virto-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .backlog-item-remove:hover {
    background: rgba(255, 106, 61, 0.1);
    color: var(--virto-accent);
  }

  /* Toast notification for copy success */
  .toast {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--virto-navy);
    color: white;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 12px 30px -10px rgba(7, 37, 74, 0.5);
    z-index: 300;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; align-items: center; gap: 10px;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast .check-icon {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--size-s);
    display: inline-flex; align-items: center; justify-content: center;
  }

  .slide-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    padding: 22px 0;
    overflow: hidden;
  }
  .content-col {
    display: flex; flex-direction: column;
    gap: 14px;
    overflow: hidden; min-width: 0;
  }

  .topic-tag {
    display: inline-flex; align-items: center; gap: 8px;
    width: max-content;
    background: linear-gradient(90deg, rgba(43, 127, 255, 0.1), rgba(43, 127, 255, 0));
    color: var(--virto-blue);
    padding: 6px 14px 6px 10px;
    border-radius: 999px;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.2px;
  }
  .topic-tag::before {
    content: ""; width: 6px; height: 6px;
    background: var(--virto-blue); border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(43, 127, 255, 0.18);
  }
  .topic-tag.wow {
    background: linear-gradient(90deg, rgba(251, 191, 36, 0.18), rgba(251, 191, 36, 0));
    color: #B45309;
  }
  .topic-tag.wow::before {
    background: var(--virto-gold);
    box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.25);
  }

  .slide-title {
    font-size: clamp(20px, 2.4vw, 28px);
    line-height: 1.15; font-weight: 800;
    color: var(--virto-navy); letter-spacing: -0.7px;
  }
  .slide-title .accent {
    background: linear-gradient(90deg, var(--virto-blue), var(--virto-cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .ps-block {
    border-left: 3px solid var(--virto-line);
    padding: 2px 0 2px 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .ps-block.problem { border-left-color: var(--virto-accent); }
  .ps-block.solution { border-left-color: var(--virto-blue); }
  .ps-block.integration { border-left-color: var(--virto-navy); }

  .ps-label {
    font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--virto-muted);
    display: flex; align-items: center; gap: 8px;
  }
  .ps-block.problem .ps-label { color: var(--virto-accent); }
  .ps-block.solution .ps-label { color: var(--virto-blue); }
  .ps-block.integration .ps-label { color: var(--virto-navy); }

  .ps-text {
    font-size: 13px; line-height: 1.5;
    color: var(--virto-text);
  }
  .ps-text strong { color: var(--virto-navy); font-weight: 600; }
  .ps-text code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    background: var(--virto-bg-2);
    color: var(--virto-navy);
    padding: 2px 6px; border-radius: 6px;
  }
  .ps-text ul { margin-top: 4px; padding-left: 18px; }
  .ps-text li { margin-bottom: 2px; }

  .visual-col {
    background: linear-gradient(135deg, var(--virto-bg) 0%, var(--virto-bg-2) 100%);
    border-radius: var(--radius);
    border: 1px solid var(--virto-line);
    overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  .visual-col img {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
  }
  .visual-caption {
    position: absolute;
    bottom: 12px; left: 12px; right: 12px;
    background: rgba(7, 37, 74, 0.85);
    color: white;
    backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 10px;
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.2px; font-weight: 500;
  }

  .no-visual {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 40px; gap: 18px;
    color: var(--virto-navy);
  }
  .no-visual .icon-circle {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--virto-blue), var(--virto-navy));
    display: flex; align-items: center; justify-content: center;
    color: white;
    box-shadow: 0 12px 30px -8px rgba(43, 127, 255, 0.5);
  }
  .no-visual h3 {
    font-size: 17px; font-weight: 700;
    color: var(--virto-navy); letter-spacing: -0.3px;
  }
  .no-visual p {
    font-size: 13px; color: var(--virto-muted);
    line-height: 1.5; max-width: 280px;
  }

  .slide-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 12px; border-top: 1px solid var(--virto-line);
    font-size: 12px; color: var(--virto-muted);
  }
  .slide-counter {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500; color: var(--virto-navy);
  }
  .slide-counter .total { color: var(--virto-muted); }
  .slide-category {
    text-transform: uppercase; letter-spacing: 1.4px;
    font-weight: 600; font-size: 11px;
  }

  /* COVER */
  .cover {
    background:
      radial-gradient(ellipse at top right, rgba(43, 127, 255, 0.15), transparent 60%),
      radial-gradient(ellipse at bottom left, rgba(56, 189, 248, 0.12), transparent 55%),
      linear-gradient(135deg, #07254A 0%, #0B3270 50%, #07254A 100%);
    color: white;
  }
  .cover .slide-header { border-color: rgba(255,255,255,0.15); }
  .cover .brand-text .b1 { color: white; }
  .cover .brand-text .b2 { color: rgba(255,255,255,0.6); }
  .cover .brand-mark { background: white; padding: 2px; }
  .cover .header-meta { color: rgba(255,255,255,0.7); }
  .cover .header-meta .pill {
    background: rgba(255,255,255,0.12); color: white;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .cover-body {
    display: flex; flex-direction: column;
    justify-content: center; gap: 22px;
    padding: 22px 0;
  }
  .cover-eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    width: max-content;
    color: var(--virto-cyan);
    font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2.5px;
  }
  .cover-eyebrow::before { content: ""; width: 28px; height: 1.5px; background: var(--virto-cyan); }
  .cover-title {
    font-size: clamp(36px, 5.5vw, 60px);
    font-weight: 800; line-height: 1; letter-spacing: -2.5px;
  }
  .cover-title .grad {
    background: linear-gradient(90deg, #38BDF8, #FFFFFF);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .cover-sub {
    font-size: 15px; line-height: 1.55;
    color: rgba(255,255,255,0.8);
    max-width: 720px; font-weight: 300;
  }
  .cover-highlights {
    display: flex; gap: 12px;
    margin-top: 4px; flex-wrap: wrap;
  }
  .cover-chip {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 9px 16px; border-radius: 12px;
    font-size: 13px; color: white;
    backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 10px;
  }
  .cover-chip .num {
    color: var(--virto-cyan); font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }

  .ts-legend {
    margin-top: 12px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    backdrop-filter: blur(10px);
  }
  .ts-legend-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
    color: rgba(255,255,255,0.6); margin-bottom: 10px; font-weight: 600;
  }
  .ts-legend-items { display: flex; gap: 16px; flex-wrap: wrap; }
  .ts-legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: rgba(255,255,255,0.85);
  }
  .ts-legend-item .ts-pill {
    width: 28px; height: 22px;
    border-radius: 6px;
    color: white; font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 11px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ts-legend-item[data-size="S"]  .ts-pill { background: var(--size-s);  }
  .ts-legend-item[data-size="M"]  .ts-pill { background: var(--size-m);  }
  .ts-legend-item[data-size="L"]  .ts-pill { background: var(--size-l);  }

  .cover .slide-footer {
    border-color: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.6);
  }
  .cover .slide-counter, .cover .slide-counter .total { color: rgba(255,255,255,0.85); }
  .cover-nav {
    display: flex; align-items: center; gap: 8px;
  }
  .cover-nav-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.2s;
  }
  .cover-nav-link:hover {
    color: white;
    border-color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.08);
  }
  .cover-nav-link svg { flex-shrink: 0; }

  /* SECTION DIVIDER */
  .section-divider {
    background: linear-gradient(135deg, var(--virto-navy) 0%, var(--virto-navy-2) 100%);
    color: white; overflow: hidden;
  }
  .section-divider .slide-inner { padding: 0; grid-template-rows: 1fr; }
  .divider-body {
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .divider-left {
    padding: 60px;
    display: flex; flex-direction: column;
    justify-content: center; gap: 20px;
  }
  .divider-right {
    background: linear-gradient(135deg, rgba(43,127,255,0.2), transparent),
                radial-gradient(circle at 30% 30%, rgba(56,189,248,0.4), transparent 60%);
    position: relative; overflow: hidden;
  }
  .divider-right::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .divider-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--virto-cyan);
    letter-spacing: 3px;
  }
  .divider-title {
    font-size: clamp(34px, 4.6vw, 52px);
    font-weight: 800; line-height: 1.05;
    letter-spacing: -1.5px;
  }
  .divider-title .grad {
    background: linear-gradient(90deg, #38BDF8, #2B7FFF);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .divider-desc {
    font-size: 15px; line-height: 1.6;
    color: rgba(255,255,255,0.7); max-width: 440px;
  }
  .divider-stat {
    display: flex; align-items: baseline; gap: 14px;
    margin-top: 8px;
  }
  .divider-stat .v {
    font-size: 52px; font-weight: 800;
    color: var(--virto-cyan);
    letter-spacing: -2px; line-height: 1;
  }
  .divider-stat .l {
    font-size: 12px; color: rgba(255,255,255,0.65);
    text-transform: uppercase; letter-spacing: 1.5px;
  }

  /* WOW divider */
  .section-divider.wow {
    background:
      radial-gradient(ellipse at 80% 20%, rgba(251,191,36,0.25), transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(43,127,255,0.25), transparent 55%),
      linear-gradient(135deg, #07254A 0%, #11305C 100%);
  }
  .section-divider.wow .divider-num { color: var(--virto-gold); }
  .section-divider.wow .divider-title .grad {
    background: linear-gradient(90deg, #FBBF24, #FF6A3D);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .section-divider.wow .divider-stat .v { color: var(--virto-gold); }

  .shape {
    position: absolute; border-radius: 50%;
    filter: blur(40px);
  }
  .shape.s1 {
    width: 280px; height: 280px;
    background: rgba(43,127,255,0.5);
    top: -40px; right: -40px;
  }
  .shape.s2 {
    width: 220px; height: 220px;
    background: rgba(56,189,248,0.4);
    bottom: -60px; left: 30%;
  }
  .section-divider.wow .shape.s1 { background: rgba(251,191,36,0.4); }
  .section-divider.wow .shape.s2 { background: rgba(255,106,61,0.4); }

  /* Section slide list (divider right column) */
  .divider-toc {
    display: flex; flex-direction: column;
    padding: 28px 24px;
    overflow-y: auto;
    position: relative; z-index: 1;
  }
  .divider-toc::-webkit-scrollbar { width: 6px; }
  .divider-toc::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
  .divider-toc-title {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 14px; padding-left: 12px;
  }
  .dtoc-slide {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 7px 12px;
    border: none; background: transparent;
    cursor: pointer; text-align: left;
    font-family: inherit;
    font-size: 15px; color: rgba(255,255,255,0.6);
    line-height: 1.35;
    transition: all 0.15s;
    border-left: 2px solid rgba(255,255,255,0.15);
    border-radius: 0 6px 6px 0;
  }
  .dtoc-slide:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
  }
  .dtoc-slide-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; opacity: 0.5;
    min-width: 18px; flex-shrink: 0;
  }
  .dtoc-slide-label { flex: 1; min-width: 0; }

  /* TOC panel */
  .toc-backdrop {
    position: fixed; inset: 0;
    background: rgba(7, 37, 74, 0.4);
    backdrop-filter: blur(4px);
    z-index: 150;
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s ease, visibility 0s linear 0.3s;
  }
  .toc-backdrop.open {
    opacity: 1; visibility: visible;
    transition: opacity 0.3s ease, visibility 0s linear 0s;
  }
  .toc-panel {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 320px;
    background: rgba(244, 247, 251, 0.97);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--virto-line);
    box-shadow: 10px 0 40px -12px rgba(7, 37, 74, 0.25);
    z-index: 160;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .toc-panel.open { transform: translateX(0); }
  .toc-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--virto-line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .toc-header h2 {
    font-size: 14px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--virto-navy);
  }
  .toc-close {
    width: 32px; height: 32px;
    border: none; background: transparent;
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--virto-muted); transition: all 0.15s;
  }
  .toc-close:hover { background: var(--virto-bg-2); color: var(--virto-navy); }
  .toc-entries {
    flex: 1; overflow-y: auto; padding: 12px 0;
  }
  .toc-entries::-webkit-scrollbar { width: 6px; }
  .toc-entries::-webkit-scrollbar-thumb { background: var(--virto-line); border-radius: 3px; }
  .toc-entry {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 12px 24px;
    border: none; background: transparent;
    cursor: pointer; text-align: left;
    font-family: inherit; color: var(--virto-text);
    transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .toc-entry:hover { background: var(--virto-bg-2); }
  .toc-entry.active {
    border-left-color: var(--virto-blue);
    background: rgba(43, 127, 255, 0.06);
  }
  .toc-entry.active .toc-entry-title { font-weight: 700; color: var(--virto-navy); }
  .toc-entry-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--virto-muted);
    min-width: 20px; flex-shrink: 0;
  }
  .toc-entry-body { flex: 1; min-width: 0; }
  .toc-entry-title {
    font-size: 13px; font-weight: 500;
    color: var(--virto-navy); line-height: 1.3;
  }
  .toc-entry-count {
    font-size: 11px; color: var(--virto-muted); margin-top: 2px;
  }
  .toc-entry-badge {
    font-size: 10px; font-weight: 600;
    color: var(--virto-muted); background: var(--virto-bg-2);
    padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
  }
  .toc-sub-entries { padding: 2px 0 4px 35px; display: none; }
  .toc-sub-entries.expanded { display: block; }
  .toc-sub-entry {
    display: block; width: 100%;
    padding: 5px 24px 5px 0;
    border: none; background: transparent;
    cursor: pointer; text-align: left;
    font-family: inherit;
    font-size: 12px; color: var(--virto-muted);
    line-height: 1.35; transition: color 0.15s;
  }
  .toc-sub-entry:hover { color: var(--virto-navy); }
  .toc-sub-entry.active { color: var(--virto-blue); font-weight: 600; }
  .toc-nav-btn {
    width: 36px; height: 36px;
    border: none; background: transparent;
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--virto-navy); transition: all 0.2s;
  }
  .toc-nav-btn:hover { background: var(--virto-bg-2); transform: translateY(-1px); }

  /* Nav Add-to-backlog toggle button (visible on all resolutions) */
  .nav-backlog-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--virto-blue);
    color: white;
    border: none;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-backlog-toggle:disabled {
    background: var(--virto-line);
    color: var(--virto-muted);
    cursor: not-allowed;
  }
  .nav-backlog-toggle.added {
    background: var(--size-s);
  }
  .nav-backlog-toggle svg { flex-shrink: 0; }
  .nav-backlog-toggle .plus-icon { display: inline-flex; }
  .nav-backlog-toggle .check-icon { display: none; }
  .nav-backlog-toggle.added .plus-icon { display: none; }
  .nav-backlog-toggle.added .check-icon { display: inline-flex; }

  /* Fullscreen image lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(7, 37, 74, 0.92);
    backdrop-filter: blur(10px);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0s linear 0.25s;
    cursor: zoom-out;
  }
  .lightbox.open {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.25s ease, visibility 0s linear 0s;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  .lightbox-close {
    position: fixed;
    top: 20px; right: 20px;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.28); }
  .lightbox-caption {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    text-align: center;
    padding: 8px 16px;
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    max-width: 90vw;
  }

  /* NAV */
  .nav {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid var(--virto-line);
    box-shadow: var(--shadow-soft);
    padding: 8px 12px; border-radius: 999px;
    z-index: 100;
  }
  .nav-btn {
    width: 36px; height: 36px;
    border: none; background: transparent;
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--virto-navy);
    transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--virto-bg-2); transform: translateY(-1px); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .nav-progress {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--virto-navy); font-weight: 600;
  }
  .nav-progress .total { color: var(--virto-muted); font-weight: 400; }
  .nav-jump {
    border-left: 1px solid var(--virto-line);
    padding-left: 12px; display: flex; gap: 6px; align-items: center;
  }

  .progress-bar {
    position: fixed; top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--virto-blue), var(--virto-cyan));
    transition: width 0.3s ease;
    z-index: 200;
    box-shadow: 0 0 12px rgba(43,127,255,0.5);
  }

  .hint {
    position: fixed; top: 24px; right: 28px;
    font-size: 11px; color: var(--virto-muted);
    text-transform: uppercase; letter-spacing: 1.4px;
    font-weight: 500;
    display: flex; align-items: center; gap: 8px;
    z-index: 100;
  }
  .key {
    background: white;
    border: 1px solid var(--virto-line);
    padding: 3px 8px; border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--virto-navy); font-weight: 600;
    box-shadow: 0 2px 4px rgba(7,37,74,0.06);
  }
  button.key-btn {
    cursor: pointer;
    font-size: inherit;
    line-height: 1;
    transition: all 0.15s;
    user-select: none;
  }
  button.key-btn:hover {
    background: var(--virto-blue);
    color: white;
    border-color: var(--virto-blue);
    transform: translateY(-1px);
    box-shadow: 0 4px 8px rgba(43, 127, 255, 0.3);
  }
  button.key-btn:active {
    transform: translateY(0);
    box-shadow: 0 1px 2px rgba(7,37,74,0.1);
  }

  /* THANKS */
  .thanks {
    background:
      radial-gradient(ellipse at center, rgba(43,127,255,0.18), transparent 60%),
      linear-gradient(135deg, #07254A 0%, #0B3270 100%);
    color: white;
  }
  .thanks .slide-inner { padding: 0; }
  .thanks-body {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 60px;
    gap: 28px; position: relative;
  }
  .thanks-eyebrow {
    color: var(--virto-cyan);
    font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 3px;
  }
  .thanks-title {
    font-size: clamp(48px, 7vw, 96px);
    font-weight: 800; line-height: 0.95;
    letter-spacing: -3px;
  }
  .thanks-title .grad {
    background: linear-gradient(90deg, #38BDF8, #FFFFFF);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .thanks-sub {
    font-size: 18px;
    color: rgba(255,255,255,0.75);
    max-width: 600px; line-height: 1.6; font-weight: 300;
  }
  .thanks-cta {
    display: flex; gap: 14px;
    margin-top: 8px;
    flex-wrap: wrap; justify-content: center;
  }
  .cta-btn {
    background: var(--virto-blue); color: white;
    padding: 14px 26px; border-radius: 12px;
    text-decoration: none;
    font-weight: 600; font-size: 14px;
    transition: all 0.25s;
    border: 1px solid var(--virto-blue);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .cta-btn:hover {
    background: var(--virto-blue-2);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -8px rgba(43,127,255,0.6);
  }
  .cta-btn.outline {
    background: transparent;
    border-color: rgba(255,255,255,0.3);
  }
  .cta-btn.outline:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.5);
  }
  .thanks-footer {
    position: absolute; bottom: 32px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ========== TABLET (<= 900px) ========== */
  /* ============================================================
     FULLSCREEN MODE ONLY — kicks in when the browser is in real
     fullscreen (F key or fullscreen button). Windowed view stays as
     the bounded-card layout above.
     ============================================================ */
  :fullscreen .stage { padding: 0; }
  :fullscreen .slide {
    width: 100vw;
    height: 100vh;
    max-width: none;
    max-height: none;
    border-radius: 0;
    box-shadow: none;
  }
  /* Scale all font-sizes and layout inside the slide by 125% in fullscreen — reads better on a big screen */
  :fullscreen .slide-inner { zoom: 1.25; }
  :fullscreen .hint { display: none; }
  :fullscreen .nav {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(12px);
    border-color: rgba(220, 229, 241, 0.35);
    box-shadow: 0 4px 20px -8px rgba(7, 37, 74, 0.15);
    opacity: 0.35;
  }
  :fullscreen .nav:hover, :fullscreen .nav:focus-within {
    opacity: 1;
    background: rgba(255,255,255,0.98);
    border-color: var(--virto-line);
    box-shadow: var(--shadow-soft);
  }

  @media (max-width: 900px) {
    /* Let the page scroll vertically when slide content is taller than the viewport */
    html, body { overflow-x: hidden; overflow-y: auto; height: auto; }
    /* Stage is a normal-flow container, not a fixed overlay */
    .stage {
      position: static;
      inset: auto;
      display: block;
      padding: 16px 16px 96px; /* bottom padding leaves room for the fixed nav pill */
      min-height: 100vh;
    }
    /* Only the active slide participates in the layout — no more absolute stacking on mobile */
    .slide {
      display: none;
      position: static;
      width: 100%;
      height: auto;
      min-height: calc(100vh - 112px); /* fills viewport at minimum */
      max-height: none;
      opacity: 1;
      transform: none;
      visibility: visible;
      transition: none;
      pointer-events: auto;
    }
    .slide.active { display: block; }
    /* Grid columns constrained to container width — fixes cover-header overflow (brand+meta wider than 302px) */
    .slide-inner {
      height: auto;
      min-height: calc(100vh - 112px);
      padding: 22px 22px 20px;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto auto;
    }
    /* Content flows naturally — no internal scroll containers, page scrolls instead */
    .slide-body, .cover-body { overflow: visible; max-height: none; min-width: 0; min-height: 0; }
    .slide-body { grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 14px 0; }
    .visual-col { min-height: 160px; max-height: 220px; min-width: 0; }
    .content-col { min-width: 0; }

    /* Header: brand on the left, size badge in the top-right corner */
    .slide-header { flex-wrap: nowrap; padding-bottom: 10px; gap: 8px; align-items: center; }
    .brand-text .b2 { display: none; }
    .brand-mark { width: 32px; height: 32px; flex-shrink: 0; }
    .brand-text .b1 { font-size: 13px; }
    .header-meta { gap: 6px; font-size: 10px; letter-spacing: 1px; flex-shrink: 0; margin-left: auto; }
    /* Category pill duplicates the slide footer — hide from the header on mobile */
    .header-meta .pill { display: none; }

    /* Divider */
    .divider-body { grid-template-columns: minmax(0, 1fr); }
    .divider-right { display: none; }
    .divider-left { padding: 40px 24px; gap: 16px; }
    .divider-title { font-size: clamp(28px, 8vw, 40px); }

    /* Cover: tighter typography + spacing */
    .cover .slide-inner { padding: 22px 20px 20px; }
    .cover-title { font-size: clamp(30px, 9vw, 44px); letter-spacing: -1.5px; overflow-wrap: break-word; }
    .cover-sub { font-size: 13px; max-width: 100%; overflow-wrap: break-word; }
    /* Cover eyebrow: allow wrap so long labels do not push past slide edge */
    .cover-eyebrow { width: auto; max-width: 100%; white-space: normal; font-size: 12px; letter-spacing: 2px; }
    .cover-highlights { gap: 8px; }
    .cover-chip { font-size: 12px; padding: 8px 12px; }
    .ts-legend { padding: 12px 14px; }
    .ts-legend-items { flex-direction: column; gap: 8px; }

    /* Topic tag: allow wrap so long labels fit on narrow content slides */
    .topic-tag { width: auto; max-width: 100%; }

    /* Content slide typography */
    .slide-title { font-size: clamp(20px, 5.5vw, 24px); overflow-wrap: break-word; }
    .ps-block { padding: 2px 0 2px 12px; }
    .ps-text { font-size: 12.5px; overflow-wrap: break-word; word-break: break-word; }
    /* Prevent long <code> tokens or version strings from causing horizontal overflow */
    .ps-text code { word-break: break-all; }

    /* Backlog eyebrow: same treatment as cover eyebrow */
    .backlog-eyebrow { width: auto; max-width: 100%; }

    /* Nav pill */
    .nav { bottom: 12px; padding: 6px 8px; gap: 6px; }
    .nav-jump { border: none; padding: 0; }
    .hint { display: none; }

/* ---------------- IMAGE LIGHTBOX ---------------- */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCaption = document.getElementById('lightboxCaption');
const lightboxClose = document.getElementById('lightboxClose');
let lightboxOpen = false;
let lightboxLastFocus = null;

function openLightbox(img) {
  lightboxImg.src = img.currentSrc || img.src;
  lightboxImg.alt = img.alt || '';
  const cap = img.parentElement.querySelector('.visual-caption');
  if (cap && cap.textContent.trim()) {
    lightboxCaption.textContent = cap.textContent.trim();
    lightboxCaption.style.display = 'block';
  } else {
    lightboxCaption.style.display = 'none';
  }
  lightboxLastFocus = document.activeElement;
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
  lightboxOpen = true;
  document.body.style.overflow = 'hidden';
  lightboxClose.focus();
}

function closeLightbox() {
  if (!lightboxOpen) return;
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  lightboxOpen = false;
  document.body.style.overflow = '';
  if (lightboxLastFocus && lightboxLastFocus.focus) lightboxLastFocus.focus();
}

lightbox.addEventListener('click', (e) => {
  // Close on backdrop click (not when the image itself is clicked)
  if (e.target === lightbox || e.target === lightboxCaption) closeLightbox();
});
lightboxClose.addEventListener('click', closeLightbox);

  const n = backlog.size;

  // Sync all "+ Add" buttons to reflect current state
  document.querySelectorAll('[data-backlog-toggle]').forEach(btn => {
    const i = parseInt(btn.dataset.backlogToggle, 10);
    btn.classList.toggle('added', backlog.has(i));

const navBacklogToggle = document.getElementById('navBacklogToggle');
const navBacklogLabel = document.getElementById('navBacklogLabel');

function syncNavBacklogToggle() {
  const s = slides[currentIndex];
  if (!s || !s.size || s.type) {
    navBacklogToggle.disabled = true;
    navBacklogToggle.classList.remove('added');
    navBacklogLabel.textContent = 'Add';
    return;
  }
  navBacklogToggle.disabled = false;
  const inList = backlog.has(currentIndex);
  navBacklogToggle.classList.toggle('added', inList);
  navBacklogLabel.textContent = inList ? 'Added' : 'Add';
  navBacklogToggle.title = inList ? 'Remove from backlog' : 'Add current slide to backlog';
}

navBacklogToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleCurrentInBacklog();
});

function renderBacklogList() {
  const list = document.getElementById('backlogList');
  if (!list) return;

  if (backlog.size === 0) {
    list.innerHTML = `
      <div class="backlog-empty">
        <div class="icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <h3>Your backlog is empty</h3>
        <p>Browse the deck and click <strong>+ Add to backlog</strong> on any feature you want to bring to your team.</p>
      </div>`;
    return;
  }

  const items = [...backlog].sort((a, b) => a - b);
  list.innerHTML = items.map((i, n) => {
    const s = slides[i];
    const sizeColor = `var(--size-${(s.size || 'm').toLowerCase()})`;
    return `
      <div class="backlog-item">
        <span class="backlog-item-num">${String(n+1).padStart(2,'0')}</span>
        <div class="backlog-item-title">
          ${stripHTML(s.title)}
          <div class="backlog-item-cat">${s.category}</div>
        </div>
        <div class="backlog-item-size">
          <span class="ts-pill" style="background: ${sizeColor};">${s.size || '—'}</span>
        </div>
        <button class="backlog-item-remove" data-remove="${i}" title="Remove">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`;
  }).join('');

  // Wire up remove buttons
  list.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.remove, 10);
      backlog.delete(i);
      updateBacklogChrome();
    });
  });
}

function buildMarkdown() {
  const items = [...backlog].sort((a, b) => a - b);
  const lines = [
    '# Virto Commerce — September 2026 Backlog',
    '',
    `Selected ${items.length} feature${items.length === 1 ? '' : 's'} from the release notes.`,
    '',
    '| # | Feature | Size | Category |',
    '| --- | --- | --- | --- |'
  ];
  items.forEach((i, n) => {
    const s = slides[i];
    const title = stripHTML(s.title).replace(/\|/g, '\\|');
    const cat = s.category.replace(/\|/g, '\\|');
    lines.push(`| ${n+1} | ${title} | ${s.size || '—'} | ${cat} |`);
  });
  lines.push('');
  lines.push('---');
  lines.push('Source: https://www.virtocommerce.org/t/virto-s-release-notes-september-2026/862');
  return lines.join('\n');
}

async function copyBacklog() {
  if (backlog.size === 0) return;
  const md = buildMarkdown();
  const btn = document.getElementById('copyBacklogBtn');
  const label = document.getElementById('copyBtnLabel');
  try {
    await navigator.clipboard.writeText(md);
    btn.classList.add('copied');
    label.textContent = 'Copied!';
    showToast(`${backlog.size} feature${backlog.size === 1 ? '' : 's'} copied as Markdown`);
    setTimeout(() => {
      btn.classList.remove('copied');
      label.textContent = 'Copy as Markdown';
    }, 2000);
  } catch (e) {
    // Fallback: select-and-show
    const ta = document.createElement('textarea');
    ta.value = md;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(`${backlog.size} features copied`);
    } catch (err) {
      showToast('Copy failed — please select manually');
    }
    document.body.removeChild(ta);
  }
}

function attachBacklogHandlers() {
  // Per-slide "+ Add" buttons
  document.querySelectorAll('[data-backlog-toggle]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.backlogToggle, 10);
      if (backlog.has(i)) {
        backlog.delete(i);
        showToast('Removed from backlog');
      } else {
        backlog.add(i);
        showToast('Added to backlog');
      }
      updateBacklogChrome();
    });
  });

  // Backlog screen action buttons
  const copyBtn = document.getElementById('copyBacklogBtn');
  if (copyBtn) copyBtn.addEventListener('click', copyBacklog);

  const clearBtn = document.getElementById('clearBacklogBtn');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      if (backlog.size === 0) return;
      if (confirm(`Clear all ${backlog.size} backlog items?`)) {
        backlog.clear();
        updateBacklogChrome();
        showToast('Backlog cleared');
      }
    });
  }

  updateBacklogChrome();
}

// Backlog link in main nav
backlogLink.addEventListener('click', () => {
  if (backlog.size === 0) return;
  showSlide(findBacklogSlideIndex());
});

function render() {
  let html = '';
  slides.forEach((s, i) => {
    if (s.type === 'cover') html += renderCover();
    else if (s.type === 'divider') html += renderDivider(s, i);
    else if (s.type === 'backlog') html += renderBacklog(i);
    else if (s.type === 'thanks') html += renderThanks(i);
    else html += renderContent(s, i);
  });
  stage.innerHTML = html;
  document.getElementById('totalSlides').textContent = String(totalSlides).padStart(2,'0');
  attachImageFallbacks();
  attachBacklogHandlers();
  // Wire up in-slide TOC navigation buttons
  document.querySelectorAll('[data-goto]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      showSlide(parseInt(btn.dataset.goto, 10));
    });
  });
  showSlide(0);
}

function showSlide(i) {
  if (i < 0 || i >= totalSlides) return;
  currentIndex = i;
  document.querySelectorAll('.slide').forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
  });
  document.getElementById('currentSlide').textContent = String(i+1).padStart(2,'0');
  document.getElementById('progressBar').style.width = `${((i+1)/totalSlides)*100}%`;
  document.getElementById('prevBtn').disabled = i === 0;
  document.getElementById('nextBtn').disabled = i === totalSlides - 1;
  // Keep the mobile nav-pill Add-to-backlog toggle in sync with the current slide
  syncNavBacklogToggle();
  // Scroll page to top on slide change so users don't land mid-content
  window.scrollTo(0, 0);
  // Re-render backlog list whenever we land on the backlog slide
  if (slides[i] && slides[i].type === 'backlog') {
    renderBacklogList();
  }
}

document.getElementById('prevBtn').addEventListener('click', () => showSlide(currentIndex - 1));
document.getElementById('nextBtn').addEventListener('click', () => showSlide(currentIndex + 1));

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

function toggleCurrentInBacklog() {
  const s = slides[currentIndex];
  if (!s || !s.size || s.type) {
    showToast('Nothing to add on this slide');
    return;
  }
  if (backlog.has(currentIndex)) {
    backlog.delete(currentIndex);
    showToast('Removed from backlog');
  } else {
    backlog.add(currentIndex);
    showToast('Added to backlog');
  }
  updateBacklogChrome();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault();
    showSlide(currentIndex + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault();
    showSlide(currentIndex - 1);
  } else if (e.key === 'Home') {
    e.preventDefault();
    showSlide(0);
  } else if (e.key === 'End') {
    e.preventDefault();
    showSlide(totalSlides - 1);
  } else if (e.key === 'f' || e.key === 'F') {
    toggleFullscreen();
  } else if (e.key === 'b' || e.key === 'B') {
    toggleCurrentInBacklog();
  } else if (e.key === 't' || e.key === 'T') {
    toggleToc();
  } else if (e.key === 'Escape') {
    if (lightboxOpen) closeLightbox();
    else closeToc();
  }
});

// Clickable hint keys
document.getElementById('hintPrev').addEventListener('click', () => showSlide(currentIndex - 1));
document.getElementById('hintNext').addEventListener('click', () => showSlide(currentIndex + 1));
document.getElementById('hintBacklog').addEventListener('click', toggleCurrentInBacklog);
document.getElementById('hintFullscreen').addEventListener('click', toggleFullscreen);
document.getElementById('hintToc').addEventListener('click', toggleToc);


let touchStartX = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
});
document.addEventListener('touchend', (e) => {
  const touchEndX = e.changedTouches[0].screenX;
  const delta = touchEndX - touchStartX;
  if (Math.abs(delta) > 60) {
    if (delta < 0) showSlide(currentIndex + 1);
    else showSlide(currentIndex - 1);
  }
});

/* ---------------- TOC PANEL ---------------- */
const tocPanel = document.getElementById('tocPanel');
const tocBackdrop = document.getElementById('tocBackdrop');
const tocEntries = document.getElementById('tocEntries');
const tocCloseBtn = document.getElementById('tocClose');
const tocToggleNavBtn = document.getElementById('tocToggleNav');
let tocOpen = false;

function renderTocPanel() {
  let html = '';
  for (let i = 0; i < slides.length; i++) {
    const s = slides[i];
    if (s.type === 'cover') {
      html += `<button class="toc-entry" data-toc-slide="0">
        <span class="toc-entry-num">—</span>
        <div class="toc-entry-body"><div class="toc-entry-title">Cover</div></div>
      </button>`;
    } else if (s.type === 'divider') {
      const label = s.title + ' ' + s.titleAccent;
      const badge = s.wow ? '<span class="toc-entry-badge" style="color:#B45309;background:rgba(251,191,36,0.18);">★ WOW</span>' : '';
      // Count children
      const children = [];
      for (let j = i + 1; j < slides.length; j++) {
        if (slides[j].type === 'divider' || slides[j].type === 'backlog' || slides[j].type === 'thanks') break;
        if (!slides[j].type) children.push(j);
      }
      html += `<button class="toc-entry" data-toc-slide="${i}">
        <span class="toc-entry-num">${s.num.replace(/Section\s*/i,'').replace(/\s*·.*/, '')}</span>
        <div class="toc-entry-body">
          <div class="toc-entry-title">${label}</div>
          <div class="toc-entry-count">${children.length} feature${children.length !== 1 ? 's' : ''}</div>
        </div>
        ${badge}
      </button>`;
      if (children.length) {
        html += '<div class="toc-sub-entries">';
        children.forEach(j => {
          html += `<button class="toc-sub-entry" data-toc-slide="${j}">${stripHTML(slides[j].title)}</button>`;
        });
        html += '</div>';
      }
    } else if (s.type === 'backlog') {
      html += `<button class="toc-entry" data-toc-slide="${i}">
        <span class="toc-entry-num">—</span>
        <div class="toc-entry-body"><div class="toc-entry-title">Backlog</div></div>
      </button>`;
    } else if (s.type === 'thanks') {
      html += `<button class="toc-entry" data-toc-slide="${i}">
        <span class="toc-entry-num">—</span>
        <div class="toc-entry-body"><div class="toc-entry-title">Thank You</div></div>
      </button>`;
    }
  }
  tocEntries.innerHTML = html;

  tocEntries.querySelectorAll('[data-toc-slide]').forEach(btn => {
    btn.addEventListener('click', () => {
      closeToc();
      showSlide(parseInt(btn.dataset.tocSlide, 10));
    });
  });
}

function updateTocActive() {
  let activeSection = 0;
  for (let i = currentIndex; i >= 0; i--) {
    if (i === 0 || slides[i].type === 'divider' || slides[i].type === 'backlog' || slides[i].type === 'thanks') {
      activeSection = i; break;
    }
  }
  tocEntries.querySelectorAll('.toc-entry').forEach(btn => {
    const idx = parseInt(btn.dataset.tocSlide, 10);
    const isActive = idx === activeSection;
    btn.classList.toggle('active', isActive);
    // Expand sub-entries only for the active section
    const subs = btn.nextElementSibling;
    if (subs && subs.classList.contains('toc-sub-entries')) {
      subs.classList.toggle('expanded', isActive);
    }
  });
  tocEntries.querySelectorAll('.toc-sub-entry').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.tocSlide, 10) === currentIndex);
  });
}

function openToc() {
  tocOpen = true;
  tocPanel.classList.add('open');
  tocBackdrop.classList.add('open');
  updateTocActive();
  const first = tocEntries.querySelector('.toc-entry.active') || tocEntries.querySelector('.toc-entry');
  if (first) first.focus();
}

function closeToc() {
  if (!tocOpen) return;
  tocOpen = false;
  tocPanel.classList.remove('open');
  tocBackdrop.classList.remove('open');
  tocToggleNavBtn.focus();
}

function toggleToc() {
  if (tocOpen) closeToc(); else openToc();
}

tocCloseBtn.addEventListener('click', closeToc);
tocBackdrop.addEventListener('click', closeToc);
tocToggleNavBtn.addEventListener('click', toggleToc);

// Mobile: swipe left to close
let tocTouchStartX = 0;
tocPanel.addEventListener('touchstart', (e) => { tocTouchStartX = e.changedTouches[0].screenX; });
tocPanel.addEventListener('touchend', (e) => {
  if (e.changedTouches[0].screenX - tocTouchStartX < -60) closeToc();
});

render();
renderTocPanel();
</script>
</body>
