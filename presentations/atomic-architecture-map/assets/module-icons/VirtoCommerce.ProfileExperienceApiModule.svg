<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Profile Experience API">
  <title>Profile Experience API</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#4FD2EE"/>
      <stop offset="100%" stop-color="#0E9BC4"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#064E63" flood-opacity="0.30"/>
    </filter>
    <clipPath id="av"><circle cx="-22" cy="-6" r="15"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(64,64)" filter="url(#lift)">
    <!-- Profile card -->
    <rect x="-42" y="-34" width="78" height="68" rx="10" fill="#ffffff"/>

    <!-- Avatar -->
    <circle cx="-22" cy="-6" r="15" fill="#4FD2EE"/>
    <g clip-path="url(#av)">
      <circle cx="-22" cy="-10" r="6" fill="#ffffff"/>
      <path d="M-33,12 a11,10 0 0 1 22,0 Z" fill="#ffffff"/>
    </g>

    <!-- Name lines -->
    <line x1="-1" y1="-13" x2="28" y2="-13" stroke="#9FB6CC" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-1" y1="-2" x2="22" y2="-2" stroke="#CBD8E6" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-32" y1="20" x2="14" y2="20" stroke="#CBD8E6" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Experience API graph badge -->
    <circle cx="27" cy="25" r="16" fill="#6A45D9"/>
    <g stroke="#ffffff" stroke-width="2.2"><line x1="27" y1="16" x2="19" y2="32"/><line x1="27" y1="16" x2="36" y2="31"/><line x1="19" y1="32" x2="36" y2="31"/></g>
    <circle cx="27" cy="16" r="3.3" fill="#ffffff"/>
    <circle cx="18.5" cy="32" r="3.3" fill="#ffffff"/>
    <circle cx="36" cy="31" r="3.3" fill="#ffffff"/>
  </g>
</svg>
