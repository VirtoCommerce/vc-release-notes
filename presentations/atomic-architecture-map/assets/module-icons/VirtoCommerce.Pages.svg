<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Pages">
  <title>Pages</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#B79DFB"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#3A1D7A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(64,63)" filter="url(#lift)">
    <!-- Back page -->
    <rect x="-20" y="-46" width="62" height="82" rx="7" fill="#CDBBFB"/>

    <!-- Front page with folded corner -->
    <path d="M-38,-30 a6,6 0 0 1 6,-6 H14 L30,-20 V38 a6,6 0 0 1 -6,6 H-32 a6,6 0 0 1 -6,-6 Z" fill="#ffffff"/>
    <polygon points="14,-36 14,-20 30,-20" fill="#D9DEE8"/>

    <!-- Title + text -->
    <line x1="-28" y1="-12" x2="6" y2="-12" stroke="#8B5CF6" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="-28" y1="0" x2="22" y2="0" stroke="#CBD8E6" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-28" y1="11" x2="22" y2="11" stroke="#CBD8E6" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-28" y1="22" x2="10" y2="22" stroke="#CBD8E6" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
