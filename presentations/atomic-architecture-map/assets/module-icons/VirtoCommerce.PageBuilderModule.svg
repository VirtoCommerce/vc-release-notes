<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Page Builder">
  <title>Page Builder</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#B79DFB"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#3A1D7A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(64,64)" filter="url(#lift)">
    <!-- Canvas -->
    <rect x="-42" y="-42" width="84" height="84" rx="10" fill="#ffffff"/>
    <!-- Layout blocks -->
    <rect x="-33" y="-33" width="66" height="15" rx="3" fill="#5FC8F5"/>
    <rect x="-33" y="-12" width="30" height="26" rx="3" fill="#FFC24D"/>
    <rect x="3" y="-12" width="30" height="26" rx="3" fill="#3FD8B4"/>
    <rect x="-33" y="20" width="40" height="13" rx="3" fill="#C4A6FF"/>

    <!-- Add-block badge -->
    <circle cx="31" cy="31" r="14" fill="#6A45D9"/>
    <line x1="31" y1="24" x2="31" y2="38" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="24" y1="31" x2="38" y2="31" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
