<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="XOrder">
  <title>XOrder</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#9D86F5"/>
      <stop offset="100%" stop-color="#6A45D9"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2C1670" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(64,66)" filter="url(#lift)">
    <!-- Clipboard -->
    <rect x="-40" y="-44" width="74" height="86" rx="9" fill="#ffffff"/>
    <rect x="-13" y="-52" width="26" height="13" rx="4" fill="#5A38C0"/>

    <!-- Rows -->
    <polyline points="-31,-22 -26,-16 -18,-28" fill="none" stroke="#2FA85A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-8" y1="-22" x2="24" y2="-22" stroke="#CBD8E6" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="-32" y="-7" width="10" height="10" rx="2.5" fill="#5FC8F5"/>
    <line x1="-16" y1="-2" x2="24" y2="-2" stroke="#CBD8E6" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="-32" y="13" width="10" height="10" rx="2.5" fill="#FFC24D"/>
    <line x1="-16" y1="18" x2="8" y2="18" stroke="#CBD8E6" stroke-width="4.5" stroke-linecap="round"/>

    <!-- GraphQL API badge -->
    <circle cx="26" cy="28" r="15" fill="#5A38C0" stroke="#ffffff" stroke-width="2.5"/>
    <g stroke="#ffffff" stroke-width="2.1"><line x1="26" y1="20" x2="19" y2="34"/><line x1="26" y1="20" x2="34" y2="33"/><line x1="19" y1="34" x2="34" y2="33"/></g>
    <circle cx="26" cy="20" r="3.1" fill="#ffffff"/>
    <circle cx="18.5" cy="34.5" r="3.1" fill="#ffffff"/>
    <circle cx="34" cy="33" r="3.1" fill="#ffffff"/>
  </g>
</svg>
