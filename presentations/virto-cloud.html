  .svc-tag { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; padding: 2px 7px; border-radius: 999px; background: var(--virto-bg-2); color: var(--virto-muted); }
  .svc-tag.invest { background: rgba(251,191,36,0.16); color: #B45309; }
  .svc-tag.preview { background: rgba(56,189,248,0.18); color: #0369A1; }
  .svc-desc { font-size: 10px; color: var(--virto-muted); line-height: 1.42; margin-top: 3px; }
  .svc-desc strong { color: var(--virto-navy); }
  .svc-strip { flex-shrink: 0; margin-top: 2px; border-radius: 12px; padding: 11px 16px; font-size: 12px; font-weight: 600; line-height: 1.4; color: #fff; display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, var(--virto-navy), var(--virto-navy-2)); }
  .svc-strip .svc-strip-ic { flex-shrink: 0; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }
  .svc-strip.gold strong { color: var(--virto-gold); }
  .svc-strip.blue { background: linear-gradient(135deg, var(--ink-blue), var(--virto-navy)); }
  .svc-strip.blue strong { color: var(--virto-cyan); }
  .svc-card.preview { border-color: rgba(56,189,248,0.55); background: linear-gradient(135deg, rgba(56,189,248,0.08), white); }
  .svc-card.preview .svc-ic { background: rgba(56,189,248,0.18); color: #0369A1; }

  /* ========== TABLET (<= 900px) ========== */
  /* ============================================================
     FULLSCREEN MODE ONLY — kicks in when the browser is in real
     fullscreen (F key or fullscreen button). Windowed view stays as
     the bounded-card layout above.
     ============================================================ */
  :fullscreen .stage { padding: 0; }
  :fullscreen .slide {
    width: 100vw;
    height: 100vh;
    max-width: none;
    max-height: none;
    border-radius: 0;
    box-shadow: none;
  }
  /* Scale all font-sizes and layout inside the slide by 125% in fullscreen — reads better on a big screen */
  :fullscreen .slide-inner { zoom: 1.25; }
  :fullscreen .hint { display: none; }
  :fullscreen .nav {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(12px);
    border-color: rgba(220, 229, 241, 0.35);
    box-shadow: 0 4px 20px -8px rgba(7, 37, 74, 0.15);
    opacity: 0.35;
  }
  :fullscreen .nav:hover, :fullscreen .nav:focus-within {
    opacity: 1;
    background: rgba(255,255,255,0.98);
    border-color: var(--virto-line);
    box-shadow: var(--shadow-soft);
  }

  @media (max-width: 900px) {
    /* Let the page scroll vertically when slide content is taller than the viewport */
    html, body { overflow-x: hidden; overflow-y: auto; height: auto; }
    /* Stage is a normal-flow container, not a fixed overlay */
    .stage {
      position: static;
      inset: auto;
      display: block;
      padding: 16px 16px 96px;
      min-height: 100vh;
    }
    /* Only the active slide participates in the layout — no more absolute stacking on mobile */
    .slide {
      display: none;
      position: static;
      width: 100%;
      height: auto;
      min-height: calc(100vh - 112px);
      max-height: none;
      opacity: 1;
      transform: none;
      visibility: visible;
      transition: none;
      pointer-events: auto;
    }
    .slide.active { display: block; }
    /* Grid columns constrained to container width — prevents header overflow */
    .slide-inner {
      height: auto;
      min-height: calc(100vh - 112px);
      padding: 22px 22px 20px;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto auto;
    }
    /* Content flows naturally — no internal scroll containers, page scrolls instead */
    .slide-body { grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 14px 0; overflow: visible; max-height: none; min-width: 0; min-height: 0; }
    .visual-col { min-height: 160px; max-height: none; min-width: 0; flex-direction: column; padding: 12px; gap: 8px; }
    .visual-col img { max-width: 100%; max-height: 55vh; width: auto; }
    .diagram-col { min-height: auto; max-height: none; }

    /* Header: brand on the left, meta pinned right, single row */
    .slide-header { flex-wrap: nowrap; padding-bottom: 10px; gap: 8px; align-items: center; }
    .brand-text .b2 { display: none; }
    .brand-mark { width: 32px; height: 32px; flex-shrink: 0; }
    .brand-text .b1 { font-size: 13px; }
    .header-meta { gap: 6px; font-size: 10px; letter-spacing: 1px; flex-shrink: 0; margin-left: auto; }

    /* Divider */
    .divider-body { grid-template-columns: minmax(0, 1fr); }
    .divider-right { display: none; }
    .divider-left { padding: 40px 24px; gap: 16px; }

    /* Cover eyebrow / topic tag wrap safely */
    .cover-eyebrow { width: auto; max-width: 100%; white-space: normal; font-size: 12px; letter-spacing: 2px; }
    .cover-title { font-size: clamp(30px, 9vw, 44px); letter-spacing: -1.5px; overflow-wrap: break-word; }
    .cover-sub { font-size: 13px; max-width: 100%; overflow-wrap: break-word; }
    .topic-tag { width: auto; max-width: 100%; }
    .slide-title { font-size: clamp(20px, 5.5vw, 24px); overflow-wrap: break-word; }
    .ps-block { padding: 2px 0 2px 12px; }
    .ps-text { font-size: 12.5px; overflow-wrap: break-word; word-break: break-word; }
    .ps-text code { word-break: break-all; }

    /* Nav pill */
    .nav { bottom: 12px; padding: 6px 8px; gap: 6px; }
    .nav-jump { border: none; padding: 0; }
    .hint { display: none; }
    .progress-bar { height: 2px; }

    /* Presentation-specific grid collapses */
    .gloss-grid { grid-template-columns: 1fr; }
    .myth-row { grid-template-columns: 1fr; }
    .myth-x { border-right: none; border-bottom: 1px solid var(--virto-line); }

    /* Thanks slide */
    .thanks-body { padding: 40px 24px; gap: 20px; }
    .thanks-title { font-size: clamp(48px, 12vw, 72px); }
    .thanks-sub { font-size: 15px; }
    .thanks-cta { flex-direction: column; width: 100%; }
    .cta-btn { justify-content: center; width: 100%; }

    /* TOC */
    .toc-panel { width: 100%; }
    .toc-entry { min-height: 44px; }
  }

  /* ========== PHONE (<= 480px) — tighter still ========== */
  @media (max-width: 480px) {
    .stage { padding: 12px 12px 88px; }
    .slide { min-height: calc(100vh - 100px); }
    .slide-inner { padding: 18px 16px 16px; min-height: calc(100vh - 100px); }
    .brand { gap: 8px; }
    .header-meta { flex-basis: auto; justify-content: flex-end; }
    .cover-title { font-size: clamp(28px, 10vw, 38px); }
    .cover-sub { font-size: 12.5px; line-height: 1.5; }
    .slide-title { font-size: clamp(18px, 5.5vw, 22px); }
    .ps-label { font-size: 10px; }
    .ps-text { font-size: 12px; line-height: 1.45; }
    .divider-left { padding: 32px 20px; }
    .nav { bottom: 10px; }
    .nav-btn { width: 32px; height: 32px; }
    .toc-nav-btn { width: 32px; height: 32px; }
  }

  @media print {
    .nav, .progress-bar, .hint, .toc-panel, .toc-backdrop { display: none; }
    .stage { padding: 0; }
    .slide { position: relative; opacity: 1; transform: none; visibility: visible; page-break-after: always; box-shadow: none; width: 100%; height: 100vh; }

    n++;

function initDemoCarousels() {
  document.querySelectorAll('[data-carousel]').forEach(car => {
    const wrap = car.closest('.demo-wrap');
    const items = car.querySelectorAll('.demo-item');
    const caps = wrap.querySelectorAll('.demo-cap');
    const dots = wrap.querySelectorAll('.demo-dot');
    let cur = 0;
    const show = (i) => {
      cur = (i + items.length) % items.length;
      items.forEach((el, k) => el.classList.toggle('active', k === cur));
      caps.forEach((el, k) => el.classList.toggle('active', k === cur));
      dots.forEach((el, k) => el.classList.toggle('active', k === cur));
    };
    car.querySelectorAll('.demo-nav').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); show(cur + parseInt(b.dataset.dir, 10)); }));
    dots.forEach(d => d.addEventListener('click', (e) => { e.stopPropagation(); show(parseInt(d.dataset.i, 10)); }));
    show(0);
  });
}

function initDemoLightbox() {
  const figs = [...document.querySelectorAll('.demo-figure')];
  const imgs = figs.map(f => { const im = f.querySelector('img'); return im ? { src: im.src, alt: im.alt } : null; }).filter(Boolean);
  if (!imgs.length) return;
  let lb = document.getElementById('demoLightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'demoLightbox';
    lb.className = 'lightbox';
    lb.setAttribute('aria-hidden', 'true');
    lb.innerHTML = '<button class="lightbox-close" aria-label="Close">&times;</button>'
      + '<button class="lightbox-nav lb-prev" aria-label="Previous">&#8249;</button>'
      + '<img class="lightbox-img" alt=""/>'
      + '<button class="lightbox-nav lb-next" aria-label="Next">&#8250;</button>'
      + '<div class="lightbox-counter"></div>';
    document.body.appendChild(lb);
  }
  const img = lb.querySelector('.lightbox-img');
  const counter = lb.querySelector('.lightbox-counter');
  let idx = 0;
  const paint = () => { img.src = imgs[idx].src; img.alt = imgs[idx].alt; counter.textContent = String(idx+1).padStart(2,'0') + ' / ' + String(imgs.length).padStart(2,'0'); };
  const open = (i) => { idx = i; paint(); lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); };
  const close = () => { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); img.removeAttribute('src'); };
  const next = () => { if (idx >= imgs.length - 1) { close(); } else { idx++; paint(); } };
  const prev = () => { if (idx > 0) { idx--; paint(); } };
  lb.querySelector('.lb-next').addEventListener('click', (e) => { e.stopPropagation(); next(); });
  lb.querySelector('.lb-prev').addEventListener('click', (e) => { e.stopPropagation(); prev(); });
  lb.querySelector('.lightbox-close').addEventListener('click', (e) => { e.stopPropagation(); close(); });
  lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
  figs.forEach((f, i) => f.addEventListener('click', (e) => { e.stopPropagation(); open(i); }));
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); close(); }
    else if (e.key === 'ArrowRight' || e.key === ' ') { e.stopPropagation(); e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.stopPropagation(); e.preventDefault(); prev(); }
  }, true);
}

            <div class="mx-ootb-chips">${slide.ootb.items.map(i => `<span>${i}</span>`).join('')}</div>
          </div>` : ''}
          ${slide.rule ? `<div class="mx-rule">${slide.rule}</div>` : ''}
        </div>
        <div class="slide-footer">
          <span class="slide-category">${slide.category}</span>
          <span class="slide-counter">${String(idx+1).padStart(2,'0')} <span class="total">/ ${String(totalSlides).padStart(2,'0')}</span></span>
        </div>
      </div>
    </div>`;
}

function renderSplit(slide, idx) {
  const benefits = slide.benefits.map(b => `
    <div class="sb-item">
      <span class="sb-ic">${b.icon}</span>
      <div><div class="sb-t">${b.t}</div><div class="sb-d">${b.d}</div></div>
    </div>`).join('');
  const m = slide.message || {};
  return `
    <div class="slide" data-index="${idx}">
      <div class="slide-inner">
        ${header(slide.category)}
        <div class="split-body">
          <div class="split-left">
            <span class="topic-tag">${slide.eyebrow || ''}</span>
            <h2 class="slide-title">${slide.title}</h2>
            <div class="split-benefits">${benefits}</div>
          </div>
          <div class="split-right">
            <div class="split-msg ${m.accent || ''}">
              ${m.kicker ? `<span class="sm-kicker">${m.kicker}</span>` : ''}
              <div class="sm-big">${m.big || ''}</div>
              ${m.sub ? `<div class="sm-sub">${m.sub}</div>` : ''}
              ${m.badge ? `<div class="sm-badge">${m.badge}</div>` : ''}
            </div>
          </div>
        </div>
        <div class="slide-footer">
          <span class="slide-category">${slide.category}</span>
          <span class="slide-counter">${String(idx+1).padStart(2,'0')} <span class="total">/ ${String(totalSlides).padStart(2,'0')}</span></span>
        </div>
      </div>
    </div>`;
}

function renderStack(slide, idx) {
  const col = c => `
    <div class="stk-col ${c.accent || 'blue'}">
      <div class="stk-col-head"><span class="stk-bar"></span>${c.label}</div>
      <div class="stk-list">
        ${c.items.map(it => `
          <div class="stk-item">
            <div class="stk-t">${it.t}</div>
            <div class="stk-d">${it.d}</div>
          </div>`).join('')}
      </div>
    </div>`;
  return `
    <div class="slide" data-index="${idx}">
      <div class="slide-inner">
        ${header(slide.category)}
        <div class="svc-wrap">
          <div class="svc-head">
            <span class="svc-eyebrow">${slide.eyebrow || 'The platform'}</span>
            <h2 class="slide-title">${slide.title}</h2>
          </div>
          <div class="stk-grid" style="grid-template-columns:repeat(${slide.columns.length},1fr)">${slide.columns.map(col).join('')}</div>
        </div>
        <div class="slide-footer">
          <span class="slide-category">${slide.category}</span>
          <span class="slide-counter">${String(idx+1).padStart(2,'0')} <span class="total">/ ${String(totalSlides).padStart(2,'0')}</span></span>
        </div>
      </div>
    </div>`;
}

function renderServices(slide, idx) {
  const card = s => `
    <div class="svc-card ${s.full ? 'full' : ''} ${s.preview ? 'preview' : ''}">
      <span class="svc-ic">${s.icon}</span>
      <div class="svc-body">
        <div class="svc-title">${s.title}${s.tag ? `<span class="svc-tag ${s.tagCls || ''}">${s.tag}</span>` : ''}</div>
        <div class="svc-desc">${s.desc}</div>
      </div>
    </div>`;
  return `
    <div class="slide" data-index="${idx}">
      <div class="slide-inner">
        ${header(slide.category)}
        <div class="svc-wrap">
          <div class="svc-head">
            <span class="svc-eyebrow">${slide.eyebrow || 'Work with our team'}</span>
            <h2 class="slide-title">${slide.title}</h2>
          </div>
          <div class="svc-grid">${slide.items.map(card).join('')}</div>
          ${slide.strip ? `<div class="svc-strip ${slide.strip.accent || ''}">${slide.strip.html}</div>` : ''}
        </div>
        <div class="slide-footer">
          <span class="slide-category">${slide.category}</span>
          <span class="slide-counter">${String(idx+1).padStart(2,'0')} <span class="total">/ ${String(totalSlides).padStart(2,'0')}</span></span>
        </div>
      </div>
    </div>`;
}

function renderGlossary(slide, idx) {
  const cards = slide.terms.map(tm => `
    <div class="gloss-card">
      <div class="gloss-term">${tm.t}</div>
      <div class="gloss-def">${tm.d}</div>
    </div>`).join('');

  return `
    <div class="slide" data-index="${idx}">
      <div class="slide-inner">
        ${header(slide.category)}
        <div class="gloss-wrap">
          <div class="gloss-head">
            <span class="gloss-eyebrow">Reference</span>
            <h2 class="slide-title">${slide.title}</h2>
            <p class="ps-text" style="color:var(--virto-muted)">${slide.intro}</p>
          </div>
          <div class="gloss-grid">${cards}</div>
        </div>
        <div class="slide-footer">
          <span class="slide-category">${slide.category}</span>
          <span class="slide-counter">${String(idx+1).padStart(2,'0')} <span class="total">/ ${String(totalSlides).padStart(2,'0')}</span></span>
        </div>
      </div>
    </div>`;
}

function renderThanks(idx) {
  return `
    <div class="slide thanks" data-index="${idx}">
      <div class="slide-inner">
        <div class="thanks-body">
          <span class="thanks-eyebrow">The bottom line</span>
          <h1 class="thanks-title">You focus on commerce.<br/>Virto <span class="grad">runs the platform underneath.</span></h1>
          <p class="thanks-sub">
            Virto runs the infrastructure, operations and SLAs underneath — the ease of a managed cloud <strong>with the SLAs to back it</strong>, and you keep ownership of your solution and your data.
          </p>
          <div class="thanks-cta">
            <a class="cta-btn" href="https://virtocommerce.com/virto-commerce-cloud" target="_blank" rel="noopener">
              Virto Cloud
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
            <a class="cta-btn outline" href="https://docs.virtocommerce.org/" target="_blank" rel="noopener">Documentation</a>
            <a class="cta-btn outline" href="https://virtocommerce.com/contact-us" target="_blank" rel="noopener">Talk to us</a>
          </div>
          <div class="thanks-footer">virtocommerce.com · Virto Cloud</div>
        </div>
      </div>
    </div>`;
}

function render() {
  let html = '';
  slides.forEach((s, i) => {
    if (s.type === 'cover') html += renderCover();
    else if (s.type === 'divider') html += renderDivider(s, i);
    else if (s.type === 'myths') html += renderMyths(s, i);
    else if (s.type === 'compare') html += renderCompare(s, i);
    else if (s.type === 'glossary') html += renderGlossary(s, i);
    else if (s.type === 'services') html += renderServices(s, i);
    else if (s.type === 'stack') html += renderStack(s, i);
    else if (s.type === 'split') html += renderSplit(s, i);
    else if (s.type === 'matrix') html += renderMatrix(s, i);
    else if (s.type === 'demo') html += renderDemo(s, i);
    else if (s.type === 'intro') html += renderIntro(s, i);
    else if (s.type === 'thanks') html += renderThanks(i);
    else html += renderContent(s, i);
  });
  stage.innerHTML = html;
  document.getElementById('totalSlides').textContent = String(totalSlides).padStart(2,'0');
  document.querySelectorAll('[data-goto]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); showSlide(parseInt(btn.dataset.goto, 10)); });
  });
  showSlide(0);
}

function showSlide(i) {
  if (i < 0 || i >= totalSlides) return;
  currentIndex = i;
  document.querySelectorAll('.slide').forEach((el, idx) => el.classList.toggle('active', idx === i));
  document.getElementById('currentSlide').textContent = String(i+1).padStart(2,'0');
  document.getElementById('progressBar').style.width = `${((i+1)/totalSlides)*100}%`;
  document.getElementById('prevBtn').disabled = i === 0;
  document.getElementById('nextBtn').disabled = i === totalSlides - 1;
  if (tocOpen) updateTocActive();
  // Reset page scroll to the top of the newly active slide on mobile
  window.scrollTo(0, 0);
}

document.getElementById('prevBtn').addEventListener('click', () => showSlide(currentIndex - 1));
document.getElementById('nextBtn').addEventListener('click', () => showSlide(currentIndex + 1));

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); showSlide(currentIndex + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showSlide(currentIndex - 1); }
  else if (e.key === 'Home') { e.preventDefault(); showSlide(0); }
  else if (e.key === 'End') { e.preventDefault(); showSlide(totalSlides - 1); }
  else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
  else if (e.key === 't' || e.key === 'T') { toggleToc(); }
  else if (e.key === 'Escape') { closeToc(); }
});

document.getElementById('hintPrev').addEventListener('click', () => showSlide(currentIndex - 1));
document.getElementById('hintNext').addEventListener('click', () => showSlide(currentIndex + 1));
document.getElementById('hintFullscreen').addEventListener('click', toggleFullscreen);
document.getElementById('hintToc').addEventListener('click', toggleToc);

let touchStartX = 0;
document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', (e) => {
  const delta = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(delta) > 60) { if (delta < 0) showSlide(currentIndex + 1); else showSlide(currentIndex - 1); }
});

/* ---------------- TOC PANEL ---------------- */
const tocPanel = document.getElementById('tocPanel');
const tocBackdrop = document.getElementById('tocBackdrop');
const tocEntries = document.getElementById('tocEntries');
const tocCloseBtn = document.getElementById('tocClose');
const tocToggleNavBtn = document.getElementById('tocToggleNav');
let tocOpen = false;

function renderTocPanel() {
  let html = '';
  for (let i = 0; i < slides.length; i++) {
    const s = slides[i];
    if (s.type === 'cover') {
      html += `<button class="toc-entry" data-toc-slide="0"><span class="toc-entry-num">—</span><div class="toc-entry-body"><div class="toc-entry-title">Cover</div></div></button>`;
    } else if (s.type === 'divider') {
      const label = (s.title + ' ' + s.titleAccent).replace(/&amp;/g, '&');
      const children = [];
      for (let j = i + 1; j < slides.length; j++) {
        if (slides[j].type === 'divider' || slides[j].type === 'thanks') break;
        children.push(j);
      }
      html += `<button class="toc-entry" data-toc-slide="${i}">
        <span class="toc-entry-num">${s.num.replace(/Section\s*/i,'').replace(/\s*·.*/, '')}</span>
        <div class="toc-entry-body">
          <div class="toc-entry-title">${label}</div>
          <div class="toc-entry-count">${children.length} slide${children.length !== 1 ? 's' : ''}</div>
        </div>
      </button>`;
      if (children.length) {
        html += '<div class="toc-sub-entries">';
        children.forEach(j => { html += `<button class="toc-sub-entry" data-toc-slide="${j}">${stripHTML(slides[j].title)}</button>`; });
        html += '</div>';
      }
    } else if (s.type === 'thanks') {
      html += `<button class="toc-entry" data-toc-slide="${i}"><span class="toc-entry-num">—</span><div class="toc-entry-body"><div class="toc-entry-title">Wrap-up</div></div></button>`;
    }
  }
  tocEntries.innerHTML = html;
  tocEntries.querySelectorAll('[data-toc-slide]').forEach(btn => {
    btn.addEventListener('click', () => { closeToc(); showSlide(parseInt(btn.dataset.tocSlide, 10)); });
  });
}

function updateTocActive() {
  let activeSection = 0;
  for (let i = currentIndex; i >= 0; i--) {
    if (i === 0 || slides[i].type === 'divider' || slides[i].type === 'thanks') { activeSection = i; break; }
  }
  tocEntries.querySelectorAll('.toc-entry').forEach(btn => {
    const idx = parseInt(btn.dataset.tocSlide, 10);
    const isActive = idx === activeSection;
    btn.classList.toggle('active', isActive);
    const subs = btn.nextElementSibling;
    if (subs && subs.classList.contains('toc-sub-entries')) subs.classList.toggle('expanded', isActive);
  });
  tocEntries.querySelectorAll('.toc-sub-entry').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.tocSlide, 10) === currentIndex);
  });
}

function openToc() {
  tocOpen = true;
  tocPanel.classList.add('open');
  tocBackdrop.classList.add('open');
  updateTocActive();
  const first = tocEntries.querySelector('.toc-entry.active') || tocEntries.querySelector('.toc-entry');
  if (first) first.focus();
}
function closeToc() {
  if (!tocOpen) return;
  tocOpen = false;
  tocPanel.classList.remove('open');
  tocBackdrop.classList.remove('open');
  tocToggleNavBtn.focus();
}
function toggleToc() { if (tocOpen) closeToc(); else openToc(); }

tocCloseBtn.addEventListener('click', closeToc);
tocBackdrop.addEventListener('click', closeToc);
tocToggleNavBtn.addEventListener('click', toggleToc);

let tocTouchStartX = 0;
tocPanel.addEventListener('touchstart', (e) => { tocTouchStartX = e.changedTouches[0].screenX; });
tocPanel.addEventListener('touchend', (e) => { if (e.changedTouches[0].screenX - tocTouchStartX < -60) closeToc(); });

render();
initDemoCarousels();
initDemoLightbox();

/* ---- hidden toggle: press c → ginger cat naps on the slide's top-right edge ---- */
(function(){
  const cat=document.getElementById('catEgg'); if(!cat) return;
  function place(){
    const card=document.querySelector('.slide.active')||document.querySelector('.slide');
    if(!card) return;
    const r=card.getBoundingClientRect();
    cat.style.left=Math.round(r.right - cat.offsetWidth - 26)+'px';
    cat.style.top=Math.round(r.top - cat.offsetHeight + 32)+'px';
  }
  const pupils=cat.querySelectorAll('.cat-pupil');
  const WAKE=250; // px: mouse closer than this wakes the cat
  addEventListener('mousemove',(ev)=>{
    if(!cat.classList.contains('show')) return;
    const r=cat.getBoundingClientRect();
    const ex=r.left+(158/190)*r.width, ey=r.top+(58/112)*r.height;
    const dx=ev.clientX-ex, dy=ev.clientY-ey, d=Math.hypot(dx,dy);
    if(d>WAKE){ cat.classList.add('sleeping'); return; }
    cat.classList.remove('sleeping');
    const m=2.6, ox=(dx/(d||1)*m).toFixed(2), oy=(dy/(d||1)*m).toFixed(2);
    pupils.forEach(p=>{ p.style.transform='translate('+ox+'px,'+oy+'px)'; });
  });
  addEventListener('resize',()=>{ if(cat.classList.contains('show')) place(); });
  addEventListener('keydown',(e)=>{
    const el=e.target, tag=(el&&el.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA'||(el&&el.isContentEditable)) return;
    if(e.code==='KeyC'){ if(cat.classList.contains('show')){ cat.classList.remove('show','sleeping'); } else { place(); cat.classList.add('show','sleeping'); } }
  });
})();

/* ---- effervescent bubbles (background) — hidden toggle: press b ---- */
(function(){
  const cv=document.getElementById('bubbles'); if(!cv) return;
  const ctx=cv.getContext('2d'); if(!ctx) return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1,bubbles=[],running=false,raf=0,t=0;
  function mk(init){ const r=1.5+Math.random()*3.2; return {x:Math.random()*W, y: init? Math.random()*H : H+r+Math.random()*30, r, v:.5+Math.random()*1.0, ph:Math.random()*6.28, wob:.3+Math.random()*.6}; }
  function size(){ dpr=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function seed(){ const n=Math.max(28,Math.round(W/16)); bubbles=Array.from({length:n},()=>mk(true)); }
  function burst(){ const n=Math.max(18,Math.round(W/26)); for(let i=0;i<n;i++){ const b=mk(false); b.y=H*(0.55+Math.random()*0.45); bubbles.push(b); } }
  function frame(){
    ctx.clearRect(0,0,W,H); t+=0.016;
    for(const b of bubbles){
      b.y-=b.v; b.x+=Math.sin(t*0.9+b.ph)*b.wob*0.3;
      if(b.y+b.r<-4) Object.assign(b, mk(false));
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283);
      ctx.fillStyle='rgba(43,127,255,0.20)'; ctx.fill();
      ctx.lineWidth=1; ctx.strokeStyle='rgba(56,189,248,0.45)'; ctx.stroke();
    }
    if(running && !reduce) raf=requestAnimationFrame(frame);
  }
  function start(){ if(running) return; running=true; if(!W) size(); seed(); burst(); cv.style.opacity='1'; frame(); }
  function stop(){ running=false; cancelAnimationFrame(raf); cv.style.opacity='0'; setTimeout(()=>{ if(!running) ctx.clearRect(0,0,W,H); },650); }
  function toggle(){ running? stop() : start(); }
  addEventListener('resize',()=>{ if(running){ size(); seed(); } });
  addEventListener('keydown',(e)=>{
    const el=e.target, tag=(el&&el.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA'||(el&&el.isContentEditable)) return;
    if(e.code==='KeyB') toggle();
  });
})();
renderTocPanel();
</script>
